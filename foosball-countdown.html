<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="شمارش زنده تا شروع نبرد فوتبال دستی کرکس بی‌رحم و بلبل رحمدل — چهارشنبه 26 AUG ساعت 16:00 به وقت ایران">
<meta property="og:type" content="website">
<meta property="og:title" content="🔥 کرکس بی‌رحم | شمارش زنده نبرد">
<meta property="og:description" content="روی کارت بزن و شمارش معکوس زنده تا بازی 26 AUG ساعت 16:00 را ببین.">
<meta property="og:url" content="https://raw.githack.com/mehdimoniricivil-byte/municipal-ai-os/foosball-countdown/foosball-countdown.html">
<meta property="og:image" content="https://raw.githubusercontent.com/mehdimoniricivil-byte/municipal-ai-os/foosball-countdown/foosball-og.jpg">

<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/jpeg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="🔥 کرکس بی‌رحم | شمارش زنده نبرد">
<meta name="twitter:description" content="26 AUG • 16:00 — شمارش معکوس زنده فوتبال دستی">
<meta name="twitter:image" content="https://raw.githubusercontent.com/mehdimoniricivil-byte/municipal-ai-os/foosball-countdown/foosball-og.jpg">
<style>
  :root{--bg:#050505;--panel:#111;--gold:#d6a63f;--text:#f7f2e8;--muted:#aaa}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 20%,rgba(214,166,63,.20),transparent 34%),linear-gradient(180deg,#090909 0%,#030303 100%)}
  .wrap{width:min(920px,100%);text-align:center}
  .kicker{color:var(--gold);font-size:13px;font-weight:900;letter-spacing:.28em;margin-bottom:16px;direction:ltr}
  h1{margin:0;font-size:clamp(38px,9vw,90px);line-height:.95;letter-spacing:-.05em;direction:ltr;font-weight:1000}
  .vs{margin-top:18px;color:var(--gold);font-size:clamp(18px,4vw,32px);font-weight:900}
  .rule{width:min(640px,90%);height:2px;margin:28px auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
  .phoneclock{margin:0 auto 18px;display:inline-flex;gap:10px;align-items:center;border:1px solid rgba(214,166,63,.45);border-radius:999px;padding:10px 16px;font-weight:800;font-size:14px}
  .phoneclock strong{font-family:"SFMono-Regular",Consolas,monospace;font-size:17px;direction:ltr;color:var(--gold)}
  .timer{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;direction:ltr}
  .unit{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid rgba(214,166,63,.5);border-radius:20px;padding:24px 8px 18px;box-shadow:0 16px 40px rgba(0,0,0,.35);min-width:0}
  .num{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace;font-size:clamp(46px,10vw,96px);line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.06em;direction:ltr;white-space:nowrap}
  .label{margin-top:12px;color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.10em;direction:ltr}
  .date{margin-top:28px;font-size:clamp(18px,3vw,26px);font-weight:900}
  .slogan{margin-top:14px;color:var(--gold);font-size:clamp(17px,3vw,24px);font-weight:800}
  .live{display:inline-flex;align-items:center;gap:9px;margin-top:24px;border:1px solid rgba(214,166,63,.45);border-radius:999px;padding:10px 14px;font-size:12px;font-weight:900;direction:ltr}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 14px var(--gold);animation:pulse 1.1s infinite ease-in-out}
  .done{display:none;color:var(--gold);font-size:clamp(46px,10vw,100px);font-weight:1000;direction:ltr;margin:28px 0 10px}
  .small{margin-top:18px;color:var(--muted);font-size:12px}
  @keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
  @media(max-width:560px){body{padding:16px}.timer{gap:7px}.unit{padding:19px 3px 14px;border-radius:15px}.num{font-size:clamp(42px,13vw,68px)}.label{font-size:10px;letter-spacing:.03em}}
  @media(prefers-reduced-motion:reduce){.dot{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <div class="kicker">FOOSBALL SHOWDOWN</div>
  <h1>RUTHLESS<br>VULTURES</h1>
  <div class="vs">VS — تیم بلبل رحمدل</div>
  <div class="rule"></div>
  <div class="phoneclock"><span>ساعت گوشی:</span><strong id="phoneTime">--:--:--</strong></div>
  <section class="timer" id="timer" aria-live="polite">
    <div class="unit"><div class="num" id="hours">00</div><div class="label">HOURS</div></div>
    <div class="unit"><div class="num" id="minutes">00</div><div class="label">MINUTES</div></div>
    <div class="unit"><div class="num" id="seconds">00</div><div class="label">SECONDS</div></div>
  </section>
  <div class="done" id="done">GAME TIME</div>
  <div class="date">چهارشنبه 26 AUG — ساعت 16:00 به وقت ایران</div>
  <div class="slogan">کرکس بی‌رحم به هیچ تیمی رحم نمی‌کند…</div>
  <div class="live"><span class="dot"></span> SYNCED TO YOUR PHONE</div>
  <div class="small">از چپ: ساعت، دقیقه، ثانیه — هماهنگ با ساعت گوشی شما.</div>
</main>
<script>
(function(){
  const target = new Date("2026-08-26T16:00:00+03:30").getTime();
  const timer = document.getElementById("timer");
  const done = document.getElementById("done");
  const phoneTime = document.getElementById("phoneTime");
  const h = document.getElementById("hours");
  const m = document.getElementById("minutes");
  const s = document.getElementById("seconds");
  function pad(n){ return String(n).padStart(2,"0"); }
  function tick(){
    const now = new Date();
    phoneTime.textContent = pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    let diff = target - now.getTime();
    if(diff <= 0){ timer.style.display = "none"; done.style.display = "block"; return; }
    timer.style.display = "grid"; done.style.display = "none";
    const total = Math.floor(diff/1000);
    h.textContent = pad(Math.floor(total/3600));
    m.textContent = pad(Math.floor((total%3600)/60));
    s.textContent = pad(total%60);
  }
  tick();
  setInterval(tick,250);
})();
</script>
</body>
</html>
