<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت صورت‌وضعیت</title><style>
@font-face{font-family:Vazirmatn;src:local(Vazirmatn)}*{box-sizing:border-box}body{margin:0;background:#0B1220;color:#e8eef8;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#162033;border:1px solid #2F415A;border-radius:14px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kpi{background:#111a2a;border:1px solid #2F415A;border-radius:12px;padding:14px}.muted{color:#9fb0c7;font-size:13px}button,input,select,textarea{font:inherit;border-radius:9px;border:1px solid #2F415A;padding:10px;background:#0f1929;color:#fff}button{background:#233554;cursor:pointer}button.primary{background:#2563eb;border-color:#2563eb}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #2F415A;text-align:right}.status{padding:4px 9px;border-radius:20px;background:#233554;font-size:12px}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap"><div class="top"><div><h2>مدیریت صورت‌وضعیت‌ها</h2><div class="muted">ایجاد، گردش کار، پرداخت و تسویه</div></div><button onclick="location.href='dashboard.html'">بازگشت به داشبورد</button></div>
<div class="grid"><div class="kpi"><div class="muted">تعداد صورت‌وضعیت</div><h3 id="count">—</h3></div><div class="kpi"><div class="muted">مبلغ خالص</div><h3 id="net">—</h3></div><div class="kpi"><div class="muted">پرداخت‌شده</div><h3 id="paid">—</h3></div><div class="kpi"><div class="muted">مانده</div><h3 id="remain">—</h3></div></div>
<div class="card"><h3>فهرست صورت‌وضعیت‌ها</h3><div class="form"><input id="year" value="1405" placeholder="سال"><select id="month"><option value="">همه ماه‌ها</option>${''}</select><select id="status"><option value="">همه وضعیت‌ها</option><option value="pending_approval">در گردش تأیید</option><option value="approved_for_payment">آماده پرداخت</option><option value="partially_paid">پرداخت جزئی</option><option value="fully_settled">تسویه کامل</option><option value="rejected">ردشده</option></select><button class="primary" onclick="loadRows()">اعمال فیلتر</button></div><div style="overflow:auto;margin-top:15px"><table><thead><tr><th>شماره</th><th>سال/ماه</th><th>مبلغ خالص</th><th>وضعیت</th><th>نسخه</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></div></div>
<script>
const BASE=location.pathname.includes('/dashboard/')?location.pathname.split('/dashboard/')[0]:'';const API=BASE+'/api/v1',token=localStorage.getItem('access_token');if(!token) location.href='login.html';
for(let i=1;i<=12;i++)month.insertAdjacentHTML('beforeend',`<option value="${i}">${i}</option>`);
const money=n=>Number(n||0).toLocaleString('fa-IR');
async function req(url,opt={}){opt.headers={...(opt.headers||{}),Authorization:`Bearer ${token}`};let r=await fetch(API+url,opt);if(r.status===401){location.href='login.html';return}if(!r.ok)throw Error((await r.json()).detail||'خطا');return r.json()}
async function loadRows(){let q=new URLSearchParams();if(year.value)q.set('year',year.value);if(month.value)q.set('month',month.value);if(status.value)q.set('status',status.value);let data=await req('/statements?'+q);rows.innerHTML=data.map(x=>`<tr><td>${x.statement_number}</td><td>${x.persian_year}/${x.persian_month}</td><td>${money(x.net_amount_irr)}</td><td><span class="status">${x.status}</span></td><td>${x.version}</td><td><button onclick="openDetail(${x.id})">مشاهده</button></td></tr>`).join('')||'<tr><td colspan="6">داده‌ای وجود ندارد</td></tr>';count.textContent=money(data.length);net.textContent=money(data.reduce((a,x)=>a+Number(x.net_amount_irr),0))+' ریال';paid.textContent='از جزئیات';remain.textContent='از جزئیات'}
async function openDetail(id){let x=await req('/statements/'+id);alert(`صورت‌وضعیت ${x.statement_number}\nخالص: ${money(x.net_amount_irr)} ریال\nپرداخت: ${money(x.paid_amount_irr)} ریال\nمانده: ${money(x.remaining_amount_irr)} ریال\nوضعیت: ${x.status}`)}loadRows().catch(e=>alert(e.message));
</script></body></html>
