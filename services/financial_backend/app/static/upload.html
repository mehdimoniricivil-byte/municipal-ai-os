<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود فایل وصول</title>
<style>
@font-face{font-family:Vazirmatn;src:local(Vazirmatn)}*{box-sizing:border-box}body{margin:0;background:#0B1220;color:#e7edf7;font-family:Vazirmatn,Tahoma,sans-serif}.shell{max-width:1050px;margin:auto;padding:24px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.brand small{color:#91a0b5}.brand h1{font-size:24px;margin:4px 0}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:800;cursor:pointer;background:#3d6fd8;color:#fff}.btn.secondary{background:#233554;border:1px solid #2F415A}.btn.danger{background:#7f3540}.btn:disabled{opacity:.5;cursor:not-allowed}.card{background:#162033;border:1px solid #2F415A;border-radius:16px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}label{display:block;font-size:12px;color:#aebbd0;margin-bottom:6px}input,select{width:100%;background:#0B1220;border:1px solid #2F415A;border-radius:10px;color:#fff;padding:11px;font:inherit}.actions{display:flex;gap:10px;align-items:center;margin-top:16px}.status{font-size:13px;color:#9eacc0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#0B1220;border:1px solid #2F415A;border-radius:12px;padding:14px}.metric b{font-size:20px;display:block;margin-top:5px}.ok{color:#68d391}.bad{color:#ff8f8f}.warn{color:#f6c85f}.issues{margin:12px 0 0;padding:0;list-style:none}.issues li{padding:9px 10px;border-bottom:1px solid #2F415A;font-size:13px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:right;padding:10px;border-bottom:1px solid #2F415A;font-size:12px}th{background:#233554}.hidden{display:none}@media(max-width:760px){.grid,.metrics{grid-template-columns:1fr}.top{align-items:flex-start;gap:10px}.actions{flex-wrap:wrap}}
</style>
</head>
<body><main class="shell">
<div class="top"><div class="brand"><small>پنل کارشناسان وصول</small><h1>بارگذاری فایل وصول</h1></div><button class="btn secondary" id="logout">خروج</button></div>
<section class="card"><div class="grid"><div><label>واحد عملیاتی</label><select id="region"></select></div><div><label>سال</label><input id="year" type="number" min="1300" max="1600" value="1405"></div><div><label>ماه</label><select id="month"></select></div></div><div style="margin-top:14px"><label>فایل Excel</label><input id="file" type="file" accept=".xlsx,.xls"></div><div class="actions"><button class="btn" id="validate">اعتبارسنجی فایل</button><span class="status" id="message"></span></div></section>
<section class="card hidden" id="result"><h3>نتیجه اعتبارسنجی</h3><div class="metrics"><div class="metric">کل ردیف‌ها<b id="totalRows">۰</b></div><div class="metric">ردیف معتبر<b class="ok" id="validRows">۰</b></div><div class="metric">ردیف نامعتبر<b class="bad" id="invalidRows">۰</b></div><div class="metric">جمع مبلغ<b id="totalAmount">۰</b></div></div><h4>خطاها و هشدارها</h4><ul class="issues" id="issues"></ul><div class="table-wrap"><table><thead><tr><th>ردیف</th><th>تاریخ</th><th>مودی</th><th>شغل</th><th>مبلغ</th></tr></thead><tbody id="preview"></tbody></table></div><div class="actions"><button class="btn" id="confirm" disabled>ثبت نهایی</button><span class="status">ثبت نهایی فقط در صورت نبود خطا فعال می‌شود.</span></div></section>
<section class="card"><h3>سوابق بارگذاری من</h3><div class="table-wrap"><table><thead><tr><th>شناسه</th><th>فایل</th><th>دوره</th><th>ردیف</th><th>مبلغ</th><th>وضعیت</th></tr></thead><tbody id="history"></tbody></table></div></section>
</main>
<script>
const BASE=location.pathname.includes('/dashboard/')?location.pathname.split('/dashboard/')[0]:'';const API=BASE+'/api/v1';const token=localStorage.getItem('access_token');let current=JSON.parse(localStorage.getItem('current_user')||'null');let uploadId=null;
if(!token) location.replace(BASE+'/dashboard/login.html');
const digits=n=>new Intl.NumberFormat('fa-IR').format(Number(n||0));
for(let i=1;i<=12;i++) month.add(new Option(digits(i),i));
month.value=String(new Date().getMonth()+1);
const regions=[['R1','منطقه ۱'],['R2','منطقه ۲'],['A2','ناحیه ۲'],['A3','ناحیه ۳'],['R3','منطقه ۳']];
async function api(path,options={}){options.headers={...(options.headers||{}),Authorization:'Bearer '+token};const r=await fetch(API+path,options);let d={};try{d=await r.json()}catch{}if(r.status===401){localStorage.clear();location.replace(BASE+'/dashboard/login.html')}if(!r.ok)throw new Error(d.detail||'خطا در ارتباط با سرور');return d}
function setupRegions(){region.innerHTML='';if(current?.role==='expert'){if(!current.region_id){message.textContent='برای این کارشناس واحد عملیاتی تعیین نشده است';validate.disabled=true;return}const item=regions[current.region_id-1]||['','واحد من'];region.add(new Option(item[1],current.region_id));region.disabled=true}else{regions.forEach((r,i)=>region.add(new Option(r[1],i+1)))}}
async function loadHistory(){try{const data=await api('/upload/history?limit=30');history.innerHTML=data.map(x=>`<tr><td>${digits(x.id)}</td><td>${x.original_filename}</td><td>${digits(x.persian_year)}/${digits(x.persian_month)}</td><td>${digits(x.total_rows)}</td><td>${digits(x.total_amount_irr)}</td><td>${x.status==='imported'?'ثبت نهایی':x.status==='validated'?'آماده ثبت':'رد شده'}</td></tr>`).join('')||'<tr><td colspan="6">سابقه‌ای وجود ندارد</td></tr>'}catch(e){history.innerHTML=`<tr><td colspan="6">${e.message}</td></tr>`}}
validate.onclick=async()=>{const f=file.files[0];if(!f){message.textContent='ابتدا فایل را انتخاب کنید';return}validate.disabled=true;message.textContent='در حال بررسی فایل…';confirm.disabled=true;uploadId=null;try{const fd=new FormData();fd.append('region_id',region.value);fd.append('year',year.value);fd.append('month',month.value);fd.append('file',f);const d=await api('/upload/validate',{method:'POST',body:fd});uploadId=d.upload_id;result.classList.remove('hidden');totalRows.textContent=digits(d.total_rows);validRows.textContent=digits(d.valid_rows);invalidRows.textContent=digits(d.invalid_rows);totalAmount.textContent=digits(d.total_amount_irr)+' ریال';issues.innerHTML=[...(d.errors||[]).map(x=>`<li class="bad">ردیف ${x.row||'-'}: ${x.message}</li>`),...(d.warnings||[]).map(x=>`<li class="warn">ردیف ${x.row||'-'}: ${x.message}</li>`)].join('')||'<li class="ok">فایل بدون خطاست و آماده ثبت نهایی است.</li>';preview.innerHTML=(d.records||[]).map(x=>`<tr><td>${digits(x.source_row_number)}</td><td>${x.payment_date_persian}</td><td>${x.payer_name||'-'}</td><td>${x.business_title||'-'}</td><td>${digits(x.amount_irr)}</td></tr>`).join('');confirm.disabled=!d.can_import;message.textContent=d.can_import?'اعتبارسنجی موفق بود':'فایل دارای خطاست و ثبت نمی‌شود';await loadHistory()}catch(e){message.textContent=e.message}finally{validate.disabled=false}};
confirm.onclick=async()=>{if(!uploadId)return;confirm.disabled=true;message.textContent='در حال ثبت نهایی…';try{const d=await api(`/upload/${uploadId}/import`,{method:'POST'});message.textContent=`${digits(d.imported_rows)} ردیف با موفقیت ثبت شد`;await loadHistory()}catch(e){message.textContent=e.message;confirm.disabled=false}};
logout.onclick=()=>{localStorage.clear();location.replace(BASE+'/dashboard/login.html')};setupRegions();loadHistory();
</script></body></html>
