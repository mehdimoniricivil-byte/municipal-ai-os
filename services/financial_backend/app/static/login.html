<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | شهرداری AI</title><style>
@font-face{font-family:Vazirmatn;src:local(Vazirmatn)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0B1220;color:#e7edf7;font-family:Vazirmatn,Tahoma,sans-serif}.box{width:min(430px,calc(100% - 32px));background:#162033;border:1px solid #2F415A;border-radius:20px;padding:30px;box-shadow:0 24px 70px #0007}.brand{font-size:12px;color:#9eacc0}.box h1{margin:8px 0 4px;font-size:25px}.sub{color:#9eacc0;margin:0 0 24px;font-size:13px}label{display:block;margin:14px 0 6px;font-size:13px}input{width:100%;padding:12px 13px;border-radius:10px;border:1px solid #2F415A;background:#0B1220;color:#fff;font:inherit;outline:none}input:focus{border-color:#5b8def}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#3d6fd8;color:#fff;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.65}.msg{min-height:22px;margin-top:12px;font-size:12px;color:#ffb4ab}.foot{margin-top:20px;color:#718096;font-size:11px;text-align:center}</style></head><body><main class="box"><div class="brand">سامانه مدیریت وصول کارگزاری</div><h1>ورود به سامانه</h1><p class="sub">اطلاعات حساب کاربری خود را وارد کنید.</p><form id="form"><label>نام کاربری</label><input id="username" autocomplete="username" required><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" minlength="8" required><button id="submit">ورود</button><div id="msg" class="msg"></div></form><div class="foot">نسخه ۰.۳ — احراز هویت و ورود فایل وصول</div></main><script>
const API_BASE=(location.pathname.startsWith('/backend-v1/')?'/backend-v1':'')+'/api/v1';
if(localStorage.getItem('access_token')) location.replace((location.pathname.startsWith('/backend-v1/')?'/backend-v1':'')+'/dashboard/'+(JSON.parse(localStorage.getItem('current_user')||'{}').role==='expert'?'upload.html':'dashboard.html'));
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),msg=document.getElementById('msg');btn.disabled=true;msg.textContent='در حال بررسی…';try{const r=await fetch(API_BASE+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:username.value.trim(),password:password.value})});const data=await r.json();if(!r.ok)throw new Error(data.detail||'ورود ناموفق بود');localStorage.setItem('access_token',data.access_token);localStorage.setItem('refresh_token',data.refresh_token);localStorage.setItem('current_user',JSON.stringify(data.user));location.replace((location.pathname.startsWith('/backend-v1/')?'/backend-v1':'')+'/dashboard/'+(data.user.role==='expert'?'upload.html':'dashboard.html'))}catch(err){msg.textContent=err.message}finally{btn.disabled=false}});
</script></body></html>
